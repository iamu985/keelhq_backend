[project]
name = "keelhq"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosmtplib>=5.1.2",
  "alembic>=1.18.5",
  "asyncpg>=0.31.0",
  "fastapi[standard]>=0.138.0",
  "fastmcp>=3.4.2",
  "ipython>=9.14.1",
  "loguru>=0.7.3",
  "pwdlib[argon2]>=0.3.0",
  "pydantic-settings>=2.14.2",
  "sqlalchemy>=2.0.51",
  "sqlmodel>=0.0.39",
  "supabase-orm>=0.2.0",
  "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
  "devtools>=0.12.2",
  "ipython>=9.14.1",
  "mypy>=2.1.0",
  "pre-commit>=4.6.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/.venv/*", "*/__init__.py/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "if __name__ == .__main__.:",
]
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["app.db.migrations.*"]
ignore_errors = true
